# Nixpacks config for Railway
[phases.setup]
aptPackages = ["fonts-noto-cjk", "fonts-noto", "fontconfig"]

[phases.install]
cmds = [
    "fc-cache -fv",
    "rm -rf /root/.cache/matplotlib /tmp/matplotlib-* 2>/dev/null || true",
    "pip install -r requirements.txt"
]

[start]
cmd = "python app.py"
