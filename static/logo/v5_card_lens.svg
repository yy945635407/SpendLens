<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Payment card / bill -->
  <rect x="28" y="32" width="44" height="30" rx="6" fill="none" stroke="#FF6B8A" stroke-width="2.5"/>
  <!-- Card chip / category indicator -->
  <rect x="34" y="37" width="10" height="7" rx="2" fill="#FF6B8A" opacity="0.3"/>
  <!-- Card data lines -->
  <g stroke="#FF6B8A" stroke-width="1.8" stroke-linecap="round" opacity="0.5">
    <line x1="48" y1="39" x2="66" y2="39"/>
    <line x1="48" y1="44" x2="62" y2="44"/>
    <line x1="34" y1="50" x2="58" y2="50"/>
    <line x1="34" y1="55" x2="52" y2="55"/>
  </g>
  <!-- Lens overlaid — examining the card -->
  <circle cx="56" cy="46" r="11" fill="none" stroke="#FF6B8A" stroke-width="2.8"/>
  <!-- Lens inner detail -->
  <circle cx="56" cy="46" r="3" fill="#FF6B8A"/>
  <g stroke="#FF6B8A" stroke-width="1.6" stroke-linecap="round" opacity="0.45">
    <line x1="48" y1="46" x2="52" y2="46"/>
    <line x1="60" y1="46" x2="64" y2="46"/>
    <line x1="56" y1="38" x2="56" y2="42"/>
    <line x1="56" y1="50" x2="56" y2="54"/>
  </g>
</svg>
