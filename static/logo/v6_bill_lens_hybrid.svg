<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Receipt body — bottom portion -->
  <path d="M 38 44 L 38 80 Q 38 84, 42 84 L 58 84 Q 62 84, 62 80 L 62 44"
        fill="none" stroke="#FF6B8A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Receipt lines -->
  <g stroke="#FF6B8A" stroke-width="1.8" stroke-linecap="round" opacity="0.45">
    <line x1="42" y1="53" x2="58" y2="53"/>
    <line x1="43" y1="59" x2="57" y2="59"/>
    <line x1="43" y1="65" x2="55" y2="65"/>
    <line x1="44" y1="71" x2="56" y2="71"/>
    <line x1="45" y1="77" x2="53" y2="77"/>
  </g>
  <!-- Lens circle at top -->
  <circle cx="50" cy="36" r="17" fill="none" stroke="#FF6B8A" stroke-width="3.2"/>
  <!-- Transition curves -->
  <path d="M 38 44 Q 38 48, 42 48 L 58 48 Q 62 48, 62 44"
        fill="none" stroke="#FF6B8A" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Focal point inside lens -->
  <circle cx="50" cy="36" r="3" fill="#FF6B8A"/>
  <g stroke="#FF6B8A" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
    <line x1="37" y1="36" x2="45" y2="36"/>
    <line x1="55" y1="36" x2="63" y2="36"/>
    <line x1="50" y1="23" x2="50" y2="31"/>
    <line x1="50" y1="41" x2="50" y2="49"/>
  </g>
</svg>
