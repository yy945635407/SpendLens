<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Lens frame -->
  <circle cx="46" cy="42" r="19.5" fill="none" stroke="#FF6B8A" stroke-width="3.2"/>
  <!-- Scattered dots — unfocused periphery -->
  <g fill="#FF6B8A" opacity="0.2">
    <circle cx="30" cy="30" r="2"/><circle cx="34" cy="27" r="1.5"/>
    <circle cx="62" cy="32" r="1.8"/><circle cx="60" cy="27" r="1.3"/>
    <circle cx="28" cy="48" r="1.6"/><circle cx="32" cy="55" r="1.4"/>
    <circle cx="60" cy="52" r="1.7"/><circle cx="63" cy="44" r="1.5"/>
  </g>
  <!-- Transitioning dots -->
  <g fill="#FF6B8A" opacity="0.45">
    <circle cx="36" cy="34" r="1.8"/><circle cx="56" cy="36" r="1.8"/>
    <circle cx="34" cy="42" r="1.9"/><circle cx="58" cy="42" r="1.9"/>
    <circle cx="38" cy="50" r="1.7"/><circle cx="54" cy="48" r="1.7"/>
  </g>
  <!-- Sharp receipt lines — in focus -->
  <g stroke="#FF6B8A" stroke-width="2.2" stroke-linecap="round">
    <line x1="38" y1="36" x2="54" y2="36" opacity="0.85"/>
    <line x1="39" y1="41" x2="53" y2="41" opacity="0.65"/>
    <line x1="40" y1="46" x2="52" y2="46" opacity="0.5"/>
  </g>
  <!-- Focal point -->
  <circle cx="46" cy="41" r="2.8" fill="#FF6B8A"/>
  <!-- Handle -->
  <line x1="60" y1="56" x2="81" y2="79" stroke="#FF6B8A" stroke-width="5.5" stroke-linecap="round"/>
</svg>
