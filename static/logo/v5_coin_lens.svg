<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Lens circle -->
  <circle cx="44" cy="42" r="19" fill="none" stroke="#FF6B8A" stroke-width="3.2"/>
  <!-- Coin at focal point -->
  <circle cx="44" cy="42" r="9" fill="none" stroke="#FF6B8A" stroke-width="2.5"/>
  <!-- ¥ symbol inside coin (abstract) -->
  <line x1="41" y1="38" x2="47" y2="38" stroke="#FF6B8A" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="46" x2="47" y2="46" stroke="#FF6B8A" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="36" x2="44" y2="48" stroke="#FF6B8A" stroke-width="2" stroke-linecap="round"/>
  <!-- Light rays focusing on coin -->
  <g stroke="#FF6B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="27" y1="28" x2="35" y2="34"/>
    <line x1="61" y1="28" x2="53" y2="34"/>
    <line x1="27" y1="56" x2="35" y2="50"/>
    <line x1="61" y1="56" x2="53" y2="50"/>
    <line x1="25" y1="42" x2="33" y2="42"/>
    <line x1="63" y1="42" x2="55" y2="42"/>
  </g>
  <!-- Handle -->
  <line x1="57" y1="56" x2="80" y2="80" stroke="#FF6B8A" stroke-width="5.5" stroke-linecap="round"/>
</svg>
