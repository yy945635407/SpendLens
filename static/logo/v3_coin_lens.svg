<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Lens frame -->
  <circle cx="45" cy="41" r="19" fill="none" stroke="#FF6B8A" stroke-width="3.2"/>
  <!-- Light rays converging inward -->
  <g stroke="#FF6B8A" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
    <line x1="28" y1="28" x2="38" y2="35"/>
    <line x1="62" y1="28" x2="52" y2="35"/>
    <line x1="26" y1="41" x2="36" y2="41"/>
    <line x1="64" y1="41" x2="54" y2="41"/>
    <line x1="28" y1="54" x2="38" y2="47"/>
    <line x1="62" y1="54" x2="52" y2="47"/>
  </g>
  <!-- Coin — double circle -->
  <circle cx="45" cy="41" r="9.5" fill="none" stroke="#FF6B8A" stroke-width="2.5"/>
  <circle cx="45" cy="41" r="7" fill="none" stroke="#FF6B8A" stroke-width="1.2" opacity="0.5"/>
  <!-- ¥ symbol -->
  <g stroke="#FF6B8A" stroke-width="2" stroke-linecap="round">
    <line x1="42.5" y1="37.5" x2="47.5" y2="37.5"/>
    <line x1="42.5" y1="44.5" x2="47.5" y2="44.5"/>
    <line x1="45" y1="36" x2="45" y2="46"/>
  </g>
  <!-- Handle -->
  <line x1="59" y1="55" x2="80" y2="78" stroke="#FF6B8A" stroke-width="5.5" stroke-linecap="round"/>
</svg>
