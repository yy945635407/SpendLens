<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Lens frame — enlarged -->
  <circle cx="48" cy="42" r="23" fill="none" stroke="#FF6B8A" stroke-width="3.5"/>
  <!-- Scattered dots — unfocused periphery (raw spending data) -->
  <g fill="#FF6B8A" opacity="0.2">
    <circle cx="28" cy="25" r="2.2"/><circle cx="34" cy="22" r="1.8"/>
    <circle cx="68" cy="28" r="2.0"/><circle cx="66" cy="22" r="1.5"/>
    <circle cx="26" cy="48" r="1.8"/><circle cx="30" cy="58" r="1.6"/>
    <circle cx="66" cy="54" r="1.9"/><circle cx="70" cy="44" r="1.7"/>
  </g>
  <!-- Transitioning dots — data being processed -->
  <g fill="#FF6B8A" opacity="0.45">
    <circle cx="36" cy="32" r="2.0"/><circle cx="60" cy="34" r="2.0"/>
    <circle cx="34" cy="42" r="2.1"/><circle cx="62" cy="42" r="2.1"/>
    <circle cx="38" cy="52" r="1.9"/><circle cx="58" cy="50" r="1.9"/>
  </g>
  <!-- Sharp receipt lines — in focus (SpendLens analysis result) -->
  <g stroke="#FF6B8A" stroke-width="2.4" stroke-linecap="round">
    <line x1="38" y1="36" x2="58" y2="36" opacity="0.85"/>
    <line x1="39" y1="42" x2="57" y2="42" opacity="0.65"/>
    <line x1="40" y1="48" x2="56" y2="48" opacity="0.5"/>
  </g>
  <!-- Focal point — moment of clarity -->
  <circle cx="48" cy="42" r="3.2" fill="#FF6B8A"/>
  <!-- Handle — enlarged -->
  <line x1="65" y1="58" x2="87" y2="82" stroke="#FF6B8A" stroke-width="6" stroke-linecap="round"/>
</svg>
