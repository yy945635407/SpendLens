<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Lens frame -->
  <circle cx="46" cy="40" r="19" fill="none" stroke="#FF6B8A" stroke-width="3.2"/>
  <!-- Yuanbao (元宝) — gold ingot shape -->
  <path d="M 33 48
           C 33 54, 59 54, 59 48
           C 59 42, 57 38, 56 37
           C 54 35, 52 35, 51 38
           C 50 41, 49 43, 49 43
           C 49 35, 47 29, 46 28
           C 45 29, 43 35, 43 43
           C 43 43, 42 41, 41 38
           C 40 35, 38 35, 36 37
           C 35 38, 33 42, 33 48 Z"
        fill="#FF6B8A" opacity="0.85"/>
  <!-- Inner shine on center hump -->
  <path d="M 44 34 C 45 31, 47 31, 48 34"
        fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <!-- Sparkle — top right -->
  <g stroke="#FF6B8A" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <line x1="53" y1="26" x2="53" y2="30"/>
    <line x1="51" y1="28" x2="55" y2="28"/>
  </g>
  <!-- Tiny sparkle — top left -->
  <g stroke="#FF6B8A" stroke-width="1.2" stroke-linecap="round" opacity="0.45">
    <line x1="36" y1="25" x2="36" y2="28"/>
    <line x1="34.5" y1="26.5" x2="37.5" y2="26.5"/>
  </g>
  <!-- Handle -->
  <line x1="60" y1="54" x2="80" y2="76" stroke="#FF6B8A" stroke-width="5.5" stroke-linecap="round"/>
</svg>
