<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="lens-clip">
      <circle cx="45" cy="42" r="17"/>
    </clipPath>
  </defs>
  <!-- Lens outline -->
  <circle cx="45" cy="42" r="18" fill="none" stroke="#FF6B8A" stroke-width="3.2"/>
  <!-- Bar chart inside lens -->
  <g clip-path="url(#lens-clip)" fill="#FF6B8A">
    <rect x="29" y="36" width="5" height="18" rx="1.5" opacity="0.45"/>
    <rect x="36" y="30" width="5" height="24" rx="1.5" opacity="0.60"/>
    <rect x="43" y="24" width="5" height="30" rx="1.5" opacity="0.80"/>
    <rect x="50" y="28" width="5" height="26" rx="1.5" opacity="0.70"/>
    <rect x="57" y="34" width="5" height="20" rx="1.5" opacity="0.55"/>
  </g>
  <!-- Bar top dots -->
  <circle cx="31.5" cy="36" r="1.8" fill="#FF6B8A" opacity="0.7"/>
  <circle cx="38.5" cy="30" r="1.8" fill="#FF6B8A" opacity="0.8"/>
  <circle cx="45.5" cy="24" r="2.2" fill="#FF6B8A"/>
  <circle cx="52.5" cy="28" r="1.8" fill="#FF6B8A" opacity="0.85"/>
  <circle cx="59.5" cy="34" r="1.8" fill="#FF6B8A" opacity="0.7"/>
  <!-- Handle -->
  <line x1="58" y1="55" x2="79" y2="77" stroke="#FF6B8A" stroke-width="5" stroke-linecap="round"/>
</svg>
