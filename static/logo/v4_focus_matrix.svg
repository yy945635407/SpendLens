<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Lens frame — bold circle -->
  <circle cx="45" cy="42" r="19" fill="none" stroke="#FF6B8A" stroke-width="3.8"/>
  <!-- Scattered dots — unfocused -->
  <g fill="#FF6B8A" opacity="0.25">
    <circle cx="29" cy="26" r="1.5"/><circle cx="35" cy="33" r="1.2"/>
    <circle cx="27" cy="38" r="1.0"/><circle cx="32" cy="28" r="1.8"/>
  </g>
  <!-- Transitioning dots -->
  <g fill="#FF6B8A" opacity="0.45">
    <circle cx="36" cy="34" r="1.6"/><circle cx="40" cy="28" r="1.5"/>
    <circle cx="33" cy="40" r="1.4"/><circle cx="30" cy="45" r="1.7"/>
    <circle cx="38" cy="36" r="1.8"/><circle cx="44" cy="32" r="1.6"/>
  </g>
  <!-- Focused center — organized dots -->
  <g fill="#FF6B8A">
    <circle cx="41" cy="38" r="2.5"/><circle cx="46" cy="38" r="2.8"/>
    <circle cx="41" cy="43" r="2.8"/><circle cx="46" cy="43" r="2.5"/>
    <circle cx="51" cy="38" r="2.2" opacity="0.7"/>
    <circle cx="56" cy="43" r="2.0" opacity="0.5"/>
  </g>
  <!-- Center focal point -->
  <circle cx="43.5" cy="40.5" r="3.5" fill="#FF6B8A"/>
  <!-- Handle -->
  <line x1="59" y1="56" x2="80" y2="78" stroke="#FF6B8A" stroke-width="5.5" stroke-linecap="round"/>
</svg>
